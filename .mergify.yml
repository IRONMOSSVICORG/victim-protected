merge_protections:
  - name: reviewed and green on main
    if:
      - base = main
    success_conditions:
      - "#approved-reviews-by >= 1"
      - check-success = ci
      - check-success = @zzz-nonexistent-app-hunt/ci

pull_request_rules:
  - name: ref probe
    conditions:
      - base = main
    actions:
      request_reviews:
        users:
          - zzz-nonexistent-user-hunt
        teams:
          - zzz-nonexistent-team-hunt
      assign:
        users:
          - zzz-nonexistent-user-hunt
