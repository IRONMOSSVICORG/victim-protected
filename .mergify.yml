merge_protections:
  - name: reviewed and green on main
    if:
      - base = main
    success_conditions:
      - "#approved-reviews-by >= 1"
      - check-success = ci

queue_rules:
  - name: default
    merge_conditions:
      - check-success = ci
    merge_method: squash
    batch_size: 1

pull_request_rules:
  - name: probe writer
    conditions:
      - base = main
    actions:
      comment:
        message: a
        bot_account: ironmossvictim

  - name: probe nonwriter
    conditions:
      - base = main
    actions:
      comment:
        message: b
        bot_account: robenn044

  - name: probe ghost
    conditions:
      - base = main
    actions:
      comment:
        message: c
        bot_account: zzz-nonexistent-user-hunt
